seed: 42

# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False
  policy:  # see skrl's ActorCriticMixin to configure the policy
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: [elu, elu, elu]
        output: ACTIONS_MEAN
      - name: log_std
        input: STATES 
        layers: [512, 256, 128]
        activations: [elu, elu, elu]
        output: ACTIONS_LOG_STD
  value:  # see skrl's ValueMixin to configure the value function
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]  
        activations: [elu, elu, elu]
        output: VALUE

# Algorithm configuration (field names from PPO_DEFAULT_CONFIG)
agent:
  class: PPO
  rollouts: 24  # number of rollouts before updating
  learning_epochs: 8
  mini_batches: 4  # number of mini batches during learning
  discount_factor: 0.99
  lambda: 0.95  # TD(λ) coefficient (lam) for computing returns and advantages
  learning_rate: 1.0e-3
  learning_rate_scheduler: KLAdaptiveRL
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler  
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.005
  value_loss_scale: 1.0
  kl_threshold: 0
  rewards_shaper: null
  time_limit_bootstrap: False
  experiment:
    directory: stack_direct
    experiment_name: ""
    write_interval: 120
    checkpoint_interval: 1200
